<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel</title><link rel="stylesheet" href="/styles.css"></head><body><header class="topbar"><div class="brand">⚙️ Admin Panel</div><div><a class="admin-link" href="/">Student Site</a><button class="btn secondary" id="logout">Logout</button></div></header><main class="container"><div id="login" class="hero"><h1>Admin Login</h1><p>Only the server-side admin password can access this panel.</p><input id="pw" type="password" placeholder="Admin password" style="padding:12px;border:1px solid var(--border);border-radius:10px;width:min(400px,100%)"><button class="btn primary" id="loginBtn">Login</button></div><div id="panel" class="hidden"><section class="hero"><h1>Manage Tests</h1><p>Create question papers, publish/unpublish them, edit timing, and view results.</p></section><div class="actions"><button class="btn primary" id="newTest">+ New Test</button><a class="btn secondary" href="/api/admin/results.csv">Export Results CSV</a></div><div id="tests" class="grid" style="margin-top:20px"></div><div id="editor" class="hidden"></div><section id="results" style="padding:30px 0 60px"><h2>Results</h2><div id="resultTable"></div></section></div></main><script src="/admin.js"></script></body></html>
